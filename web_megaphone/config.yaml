name: "Web Megaphone"
version: "0.86"
slug: "web_megaphone"
description: "Web PA System"
url: "https://github.com/netmms/ha_netmms/tree/main/web_megaphone"

# Icons to show in the Home Assistant Add-on Store
logo: "https://raw.githubusercontent.com/netmms/ha_netmms/main/web_megaphone/logo.png"
icon: "https://raw.githubusercontent.com/netmms/ha_netmms/main/web_megaphone/icon.png"

init: false
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386

stdin: true
audio: true

host_network: true

ports:
  8001/tcp: 8001

# the "Open Web UI" button on the add-on page
webui: "https://[HOST]:[PORT:8001]/"

map:
  - share:rw
  - config:rw
  - ssl

options:
  volume1: 30
  volume2: 100
  voice_boost: 6
  use_pipe: false
  pipe: "/share/snapserver/stream"

schema:
  volume1: int(0,100)
  volume2: int(0,100)
  voice_boost: int(0,10)
  use_pipe: bool
  pipe: str
  