<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#eef1f4">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="PA Mic">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" href="favicon-32x32.png">
  <title>PA Mic</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-rec="idle">
  <main class="card">
    <h1>PA Microphone</h1>
    <p class="sub">Announce to the whole house</p>

    <div class="stage">
      <div id="halo" class="halo"></div>
      <button id="talk" class="talk" type="button" aria-label="Record a message">
        <svg class="ico-mic" viewBox="0 0 24 24" aria-hidden="true">
          <rect x="9" y="3" width="6" height="11" rx="3"/>
          <path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21M8.5 21h7"/>
        </svg>
        <svg class="ico-send" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 12l16-8-6 16-2.5-6.5L4 12z"/>
        </svg>
        <span id="talk-label">Talk</span>
      </button>
    </div>

    <div id="time" class="time">0:00</div>
    <div id="status" class="status" role="status" aria-live="polite">Tap the button and speak</div>

    <div class="actions">
      <button id="cancel" class="ghost" type="button" hidden>Cancel</button>
      <button id="retry" class="ghost" type="button" hidden>Send again</button>
      <button id="repeat" class="ghost" type="button" disabled>Repeat last</button>
    </div>
  </main>

  <footer>
    <span id="format"></span>
    <span id="version"></span>
    <a href="ca.crt" title="Install once on a phone or computer: no more certificate warnings">certificate</a>
  </footer>

  <script src="js/recorder.js"></script>
  <script src="version.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
