            </g>
          </g>
        </svg>
        <span id="talk-label">Talk</span>
      </button>
    </div>

    <div id="time" class="time">0:00</div>
    <div id="status" class="status" role="status" aria-live="polite">Tap the button and speak</div>

    <div class="actions">
      <button id="cancel" class="ghost" type="button" hidden>Cancel</button>
      <button id="retry" class="ghost" type="button" hidden>Send again</button>
      <button id="repeat" class="ghost" type="button" disabled>Repeat last</button>
    </div>
  </main>

  <footer>
    <span id="format"></span>
    <span id="version"></span>
    <a href="ca.crt" title="Install once on a phone or computer: no more certificate warnings">certificate</a>
  </footer>

  <script src="version.js"></script>
