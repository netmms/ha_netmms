name: "Prayer Times"
version: "1.01"
slug: "prayer_times"
description: "Prayer times (Umm al-Qura or Egyptian) as Home Assistant sensors over MQTT, calculated like the NETMMS clock. Rolls over right after Isha."
url: "https://github.com/netmms/ha_netmms/tree/main/prayer_times"

# Icons shown in the Home Assistant add-on store
logo: "https://raw.githubusercontent.com/netmms/ha_netmms/main/prayer_times/logo.png"
icon: "https://raw.githubusercontent.com/netmms/ha_netmms/main/prayer_times/icon.png"

init: false
arch:
  - aarch64
  - amd64

startup: application
boot: auto

# the broker comes from the Mosquitto add-on automatically; the mqtt_* options override it
services:
  - mqtt:want

options:
  latitude: 26.2361
  longitude: 50.0393
  timezone: "Asia/Riyadh"
  method: "um_alqura"
  device_name: "Prayer Times"
  topic_prefix: "prayer_times"
  rollover_delay_seconds: 60

schema:
  latitude: float(-90,90)
  longitude: float(-180,180)
  timezone: str
  method: list(um_alqura|egyptian)
  device_name: str
  topic_prefix: str
  rollover_delay_seconds: int(0,3600)
  mqtt_host: str?
  mqtt_port: port?
  mqtt_user: str?
  mqtt_password: password?
