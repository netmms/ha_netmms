# Adhan at each prayer time: one automation, five triggers, and the PRAYER NAME decides the sound.
#
# Each trigger fires when the current time equals the time in that sensor. Its `id` is the
# prayer's name, so the actions know which prayer fired: Fajr plays adhan_fajr.mp3, every other
# prayer plays adhan_normal.mp3. Sunrise is not a trigger, so nothing plays at sunrise.
#
# script.play_media is the script that plays a file (media: file name, vol: volume or "def").
alias: Adhan
description: ''
mode: single
triggers:
  - trigger: time
    at: sensor.prayer_times_fajr
    id: Fajr
  - trigger: time
    at: sensor.prayer_times_dhuhr
    id: Dhuhr
  - trigger: time
    at: sensor.prayer_times_asr
    id: Asr
  - trigger: time
    at: sensor.prayer_times_maghrib
    id: Maghrib
  - trigger: time
    at: sensor.prayer_times_isha
    id: Isha
conditions: []
actions:
  - choose:
      - conditions:
          - condition: trigger
            id: Fajr
        sequence:
          - action: script.play_media
            data:
              media: adhan_fajr.mp3
              vol: def
    default:
      - action: script.play_media
        data:
          media: adhan_normal.mp3
          vol: def
